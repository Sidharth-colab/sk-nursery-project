<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <title>SK Greenary</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            background-image: url('https://i.ibb.co/VYVnRJ51/photo-2026-03-14-11-56-24.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }
        .hero-section {
            background-image: url('https://i.ibb.co/cS5pvjmP/photo-2026-03-14-11-56-16.jpg');
            background-size: cover;
            background-position: center;
            padding: 50px 20px 40px;
            text-align: center;
            position: relative;
        }
        .hero-section::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.35);
        }
        .hero-logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: #f5c842;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
            white-space: nowrap;
        }     
        .hero-tagline {
            color: white;
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 6px;
        }
        .search-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255,255,255,0.95);
            padding: 10px 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .search-bar input {
            border-radius: 25px;
            border: 2px solid #2d9e4f;
            padding: 8px 18px;
            width: 100%;
            font-size: 0.9rem;
            outline: none;
            background: white;
            font-family: 'Poppins', sans-serif;
        }
        .category-tabs {
            display: flex;
            gap: 8px;
            padding: 10px 12px;
            overflow-x: auto;
            background: rgba(255,255,255,0.85);
            border-bottom: 1px solid #ddd;
        }
        .category-tabs::-webkit-scrollbar { display: none; }
        .cat-btn {
            border: 2px solid #2d9e4f;
            background: white;
            color: #2d9e4f;
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Poppins', sans-serif;
        }
        .cat-btn.active, .cat-btn:hover {
            background: #2d9e4f;
            color: white;
        }
        .plant-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 10px;
        }
        @media (min-width: 768px) {
            .plant-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 20px; }
        }
        @media (min-width: 1024px) {
            .plant-grid { grid-template-columns: repeat(4, 1fr); }
        }
        .plant-card {
            background: rgba(255,255,255,0.92);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.12);
            transition: transform 0.2s;
            cursor: pointer;
        }
        .plant-card:hover { transform: translateY(-3px); }
        .plant-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }
        .plant-emoji {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }
        .plant-info { padding: 8px; }
